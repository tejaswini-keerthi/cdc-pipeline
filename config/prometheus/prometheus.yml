# Prometheus scrape config for the CDC pipeline.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (DLQ, latency SLA, consumer lag).
rule_files:
  - /etc/prometheus/rules/*.yml

# Route firing alerts to Alertmanager.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Flink pipeline metrics (checkpoints, records/sec, backpressure).
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]
  - job_name: flink-taskmanager
    static_configs:
      - targets: ["taskmanager:9249"]

  # Kafka consumer-group lag (Flink's flink-cdc-* groups).
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Custom per-table replication latency + ingestion throughput.
  - job_name: cdc-latency-exporter
    static_configs:
      - targets: ["latency-exporter:8000"]

  # DLQ router — failed-event counts.
  - job_name: cdc-dlq-router
    static_configs:
      - targets: ["dlq-router:8001"]
